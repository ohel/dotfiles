context.objects = [
    {
        factory = "adapter"
        args = {
            factory.name = "api.alsa.pcm.sink"
            node.name = "alsa-bridge"
            node.description = "PipeWire ALSA bridge"
            media.class = "Audio/Sink"
            object.linger = true
            audio.position = [ FL FR ]

            api.alsa.path = "default"
            api.alsa.period-size = 128
            api.alsa.headroom = 0
        }
    }
]

context.exec = [
    {
        path = "pw-metadata"
        args = "-n settings 0 default.configured.audio.sink {\"name\":\"alsa-bridge\"}"
    }
]
