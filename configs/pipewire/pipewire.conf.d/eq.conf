context.modules = [
    {
        name = libpipewire-module-filter-chain
        flags = [ ifexists nofail ]
        args = {
            node.name = "pipewire-eq"
            node.description = "PipeWire equalizer"
            media.class = "Audio/Sink"
            audio.position = [ FL FR ]

            filter.graph = {
                nodes = [
                    # Preamp -6 dB for headroom.
                    {
                        type = builtin
                        name = preamp
                        label = linear
                        control = {
                            "Mult" = 0.5012
                            "Add" = 0.0
                        }
                    }

                    # Deep bass boost.
                    {
                        type = builtin
                        name = subbass
                        label = bq_lowshelf
                        control = {
                            "Freq" = 40.0
                            "Q" = 0.7
                            "Gain" = 6.0
                        }
                    }

                    # Dampen mids and treble.
                    {
                        type = builtin
                        name = cut
                        label = bq_highshelf
                        control = {
                            "Freq" = 80.0
                            "Q" = 0.7
                            "Gain" = -18.0
                        }
                    }
                ]

                links = [
                    { output = "preamp:Out" input = "subbass:In" }
                    { output = "subbass:Out" input = "cut:In" }
                ]
            }

            capture.props = {
                node.name = "eq-input"
                media.class = "Audio/Sink"
            }
            playback.props = {
                node.name   = "eq-output"
                node.passive = true
                target.object = "alsa-bridge"
            }
        }
    }
]
